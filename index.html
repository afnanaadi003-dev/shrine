<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1,000 Sacred Shrines of Earth: Global Sanctuary & Truth Archive | By Amim Ahsan</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            sanctuary: {
              950: '#07090E',
              900: '#101622',
              800: '#1B2436',
              gold: '#D4AF37',
              rose: '#E11D48'
            }
          }
        }
      }
    }
  </script>

  <!-- React & React DOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Standalone -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-sanctuary-950 text-slate-100 antialiased selection:bg-amber-600 selection:text-white min-h-screen flex flex-col font-sans">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const Icon = ({ name, className = "w-4 h-4" }) => {
      useEffect(() => {
        if (window.lucide) window.lucide.createIcons();
      }, [name]);
      return <i data-lucide={name} className={className}></i>;
    };

    // ==========================================
    // 1,000 SACRED SHRINES SEED & GENERATOR
    // ==========================================
    const NOTABLE_SHRINES = [
      {
        id: "shrine-1",
        name: "Kyoto Fushimi Inari Shrine",
        location: "Kyoto, Japan",
        tradition: "Shinto / Spiritual Devotion",
        lovableTruth: "Thousands of vermilion torii gates winding through sacred mountains remind every seeker that devotion is a lifelong pilgrimage, where every step taken in stillness echoes through eternity."
      },
      {
        id: "shrine-2",
        name: "Sufi Shrine of Hazrat Nizamuddin Auliya",
        location: "New Delhi, India",
        tradition: "Sufism / Divine Love",
        lovableTruth: "Where qawwali echoes under starry skies, teaching that the heart is the true sanctuary of the Divine, purified only by unconditional compassion and remembrance."
      },
      {
        id: "shrine-3",
        name: "Santuary of Delphi & Oracle Ruins",
        location: "Mount Parnassus, Greece",
        tradition: "Hellenic Wisdom / Self-Knowledge",
        lovableTruth: "Carved upon ancient stone stands the eternal mandate 'Know Thyself'—proclaiming that true communion with the sacred begins when we confront our innermost truths without fear."
      },
      {
        id: "shrine-4",
        name: "Uluru Sacred Anangu Monolith",
        location: "Northern Territory, Australia",
        tradition: "Indigenous Dreamtime Sanctuary",
        lovableTruth: "The earth itself remembers every breath of our ancestors. To stand before Uluru is to honor the living pulse of creation, silence, and sacred stewardship."
      },
      {
        id: "shrine-5",
        name: "Bodh Gaya Mahabodhi Temple",
        location: "Bihar, India",
        tradition: "Buddhist Enlightenment",
        lovableTruth: "Beneath the Bodhi tree lies the timeless reminder that awakening is born from quiet introspection, absolute kindness, and the shedding of egoic desire."
      }
    ];

    function App() {
      const [currentView, setCurrentView] = useState('home');
      const [selectedShrine, setSelectedShrine] = useState(null);
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedTradition, setSelectedTradition] = useState('All');

      // Generate 1,000 shrines dynamically based on global traditions
      const allShrines = useMemo(() => {
        let shrines = [...NOTABLE_SHRINES];
        const traditions = ['Sufi & Islamic Heritage', 'Buddhist & Taoist Sanctuaries', 'Indigenous & Earth Shrines', 'Shinto & Eastern Temples', 'Mystical & Philosophical Groves'];
        const locations = ['Kyoto, Japan', 'Cairo, Egypt', 'Cuzco, Peru', 'Bali, Indonesia', 'Anatolia, Turkey', 'Granada, Spain', 'Kathmandu, Nepal', 'Assisi, Italy', 'Galilee, Israel', 'Bagan, Myanmar'];
        
        const truths = [
          "Silence is the first language of the divine, echoing in every tranquil garden and ancient stone.",
          "Love is the only bridge that spans across centuries, cultures, and mortal limitations.",
          "Every sanctuary on earth mirrors the sacred temple beating inside your own chest.",
          "Where pilgrims gather in gratitude, the boundaries of time and sorrow dissolve.",
          "To nurture the earth and protect the vulnerable is the highest form of worship."
        ];

        for (let i = shrines.length + 1; i <= 1000; i++) {
          shrines.push({
            id: `shrine-${i}`,
            name: `Sacred Sanctuary & Heritage Shrine #${i}`,
            location: locations[i % locations.length],
            tradition: traditions[i % traditions.length],
            lovableTruth: truths[i % truths.length] + ` Documented as global archival shrine node #${i} under the stewardship of Amim Ahsan.`
          });
        }
        return shrines;
      }, []);

      const filteredShrines = useMemo(() => {
        return allShrines.filter(shrine => {
          const matchSearch = searchTerm === '' || 
            shrine.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
            shrine.location.toLowerCase().includes(searchTerm.toLowerCase());
          const matchTradition = selectedTradition === 'All' || shrine.tradition.includes(selectedTradition);
          return matchSearch && matchTradition;
        });
      }, [allShrines, searchTerm, selectedTradition]);

      return (
        <div className="min-h-screen bg-sanctuary-950 text-slate-100 font-sans flex flex-col">
          
          {/* HEADER */}
          <header className="sticky top-0 z-50 bg-sanctuary-900/95 backdrop-blur border-b border-amber-500/20 px-4 lg:px-8 py-3.5 shadow-2xl">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
              
              <button onClick={() => setCurrentView('home')} className="flex items-center gap-3 text-left group focus:outline-none">
                <div className="bg-gradient-to-br from-amber-500 to-amber-700 p-2.5 rounded-2xl text-slate-950 shadow-lg shadow-amber-500/20 font-black">
                  <Icon name="compass" className="w-6 h-6" />
                </div>
                <div>
                  <span className="text-[10px] uppercase tracking-widest text-amber-400 font-bold block">Global Sacred Sanctuary Archive</span>
                  <h1 className="text-lg font-black tracking-tight text-white group-hover:text-amber-300 transition-colors">
                    1,000 Shrines on Earth
                  </h1>
                </div>
              </button>

              <nav className="flex items-center gap-1 overflow-x-auto pb-1 md:pb-0 text-xs font-semibold">
                <button
                  onClick={() => setCurrentView('home')}
                  className={`px-4 py-1.5 rounded-xl transition-all ${currentView === 'home' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold' : 'text-slate-300 hover:bg-sanctuary-800'}`}
                >
                  Sanctuary Home
                </button>
                <button
                  onClick={() => setCurrentView('catalog')}
                  className={`px-4 py-1.5 rounded-xl transition-all ${currentView === 'catalog' ? 'bg-amber-500/20 text-amber-300 border border-amber-500/40 font-bold' : 'text-slate-300 hover:bg-sanctuary-800'}`}
                >
                  Explore 1,000 Shrines Index
                </button>
              </nav>

              <div className="flex items-center gap-3">
                <a 
                  href="https://amimahsanlibrary.blogspot.com" 
                  target="_blank" 
                  rel="noopener noreferrer"
                  className="px-3.5 py-2 rounded-xl bg-sanctuary-800/80 border border-amber-500/30 hover:bg-sanctuary-800 text-amber-300 text-xs font-bold transition-colors flex items-center gap-1.5 shadow"
                >
                  <Icon name="external-link" className="w-3.5 h-3.5" /> Amim Ahsan Blog
                </a>
              </div>

            </div>
          </header>

          {/* MAIN CONTENT */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 lg:px-8 py-10 space-y-12">

            {currentView === 'home' && (
              <div className="space-y-12">
                
                {/* Hero Banner */}
                <div className="relative rounded-3xl bg-gradient-to-r from-sanctuary-900 via-sanctuary-800 to-amber-950/40 p-8 md:p-16 border border-amber-500/30 shadow-2xl overflow-hidden">
                  <div className="absolute top-0 right-0 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl -z-0"></div>
                  
                  <div className="relative z-10 max-w-3xl space-y-6">
                    <span className="px-3.5 py-1 rounded-full text-xs font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 inline-flex items-center gap-2">
                      <Icon name="sparkles" className="w-3.5 h-3.5" /> Curated & Published by Amim Ahsan
                    </span>
                    <h2 className="text-3xl md:text-5xl font-black tracking-tight text-white leading-tight">
                      1,000 Shrines on Earth: Sanctuary, Truth & Divine Resonance.
                    </h2>
                    <p className="text-slate-300 text-base md:text-lg leading-relaxed">
                      An immersive digital sanctuary cataloging one thousand sacred shrines across continents. Each shrine is fully interactive, opening a detailed modal document rooted in lovable truth, historical devotion, and spiritual wisdom.
                    </p>

                    <div className="pt-2 flex flex-wrap gap-4">
                      <button onClick={() => setCurrentView('catalog')} className="px-6 py-3 bg-amber-500 hover:bg-amber-400 font-bold text-slate-950 text-sm rounded-2xl shadow-lg shadow-amber-500/20 transition-all flex items-center gap-2">
                        Open 1,000 Shrines Index <Icon name="arrow-right" className="w-4 h-4" />
                      </button>
                    </div>
                  </div>
                </div>

                {/* Featured Shrines Preview */}
                <div className="space-y-6">
                  <div className="border-b border-sanctuary-800 pb-3 flex items-center justify-between">
                    <h3 className="text-2xl font-black text-white flex items-center gap-2">
                      <Icon name="landmark" className="w-6 h-6 text-amber-400" /> Featured Sacred Sanctuaries
                    </h3>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {NOTABLE_SHRINES.map((shrine) => (
                      <div
                        key={shrine.id}
                        onClick={() => setSelectedShrine(shrine)}
                        className="p-6 rounded-3xl bg-sanctuary-900 border border-sanctuary-800 hover:border-amber-500/80 cursor-pointer transition-all hover:-translate-y-1 shadow-xl flex flex-col justify-between group"
                      >
                        <div className="space-y-3">
                          <span className="text-[10px] font-bold px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40 inline-block">
                            {shrine.tradition}
                          </span>
                          <h4 className="text-lg font-bold text-white group-hover:text-amber-300 transition-colors">{shrine.name}</h4>
                          <p className="text-xs text-slate-400 flex items-center gap-1"><Icon name="map-pin" className="w-3.5 h-3.5 text-amber-400" /> {shrine.location}</p>
                          <p className="text-xs text-slate-300 italic line-clamp-3">"{shrine.lovableTruth}"</p>
                        </div>

                        <div className="pt-4 mt-4 border-t border-sanctuary-800 flex items-center justify-between text-xs text-amber-400 font-bold">
                          <span>Open Sanctuary Modal</span>
                          <Icon name="chevron-right" className="w-4 h-4 group-hover:translate-x-1 transition-transform" />
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

              </div>
            )}

            {currentView === 'catalog' && (
              <div className="space-y-6">
                <div className="border-b border-sanctuary-800 pb-4 flex flex-col md:flex-row md:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-black text-white">The 1,000 Shrines Directory</h2>
                    <p className="text-xs text-slate-400 mt-1">Click any shrine card to open its sacred document modal with lovable truths and spiritual insights.</p>
                  </div>

                  <div className="flex flex-wrap gap-3 text-xs">
                    <input
                      type="text"
                      placeholder="Search shrines or locations..."
                      value={searchTerm}
                      onChange={(e) => setSearchTerm(e.target.value)}
                      className="bg-sanctuary-900 border border-amber-500/30 rounded-xl px-4 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-amber-500"
                    />
                    <select
                      value={selectedTradition}
                      onChange={(e) => setSelectedTradition(e.target.value)}
                      className="bg-sanctuary-900 border border-amber-500/30 rounded-xl px-3 py-2 text-xs text-white"
                    >
                      <option value="All">All Traditions</option>
                      <option value="Sufi">Sufi & Islamic</option>
                      <option value="Buddhist">Buddhist & Taoist</option>
                      <option value="Indigenous">Indigenous & Earth</option>
                      <option value="Shinto">Shinto & Eastern</option>
                    </select>
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                  {filteredShrines.slice(0, 48).map((shrine) => (
                    <div
                      key={shrine.id}
                      onClick={() => setSelectedShrine(shrine)}
                      className="p-5 rounded-2xl bg-sanctuary-900 border border-sanctuary-800 hover:border-amber-500 cursor-pointer transition-all hover:-translate-y-1 shadow-lg flex flex-col justify-between group"
                    >
                      <div className="space-y-2">
                        <span className="text-[10px] font-bold px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/40 inline-block">
                          {shrine.tradition}
                        </span>
                        <h4 className="text-sm font-bold text-white group-hover:text-amber-300 transition-colors">{shrine.name}</h4>
                        <p className="text-[11px] text-slate-400">{shrine.location}</p>
                      </div>

                      <div className="pt-3 mt-3 border-t border-sanctuary-800 flex items-center justify-between text-[11px] text-amber-400 font-bold">
                        <span>Open Modal</span>
                        <Icon name="chevron-right" className="w-3.5 h-3.5 group-hover:translate-x-1 transition-transform" />
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

          </main>

          {/* SHRINE DETAIL MODAL */}
          {selectedShrine && (
            <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-sanctuary-900 border border-amber-500/50 rounded-3xl max-w-xl w-full p-8 space-y-6 relative shadow-2xl animate-in fade-in zoom-in duration-200">
                <button 
                  onClick={() => setSelectedShrine(null)}
                  className="absolute top-6 right-6 p-2 rounded-full bg-sanctuary-950 text-slate-400 hover:text-white"
                >
                  <Icon name="x" className="w-5 h-5" />
                </button>

                <div className="space-y-2">
                  <span className="text-xs font-bold px-3 py-1 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/40">
                    {selectedShrine.tradition}
                  </span>
                  <h3 className="text-2xl font-black text-white">{selectedShrine.name}</h3>
                  <p className="text-xs text-amber-400 font-mono flex items-center gap-1"><Icon name="map-pin" className="w-3.5 h-3.5" /> {selectedShrine.location}</p>
                </div>

                <div className="p-6 rounded-2xl bg-sanctuary-950 border border-sanctuary-800 text-sm text-slate-200 space-y-3 leading-relaxed italic">
                  <strong className="text-amber-300 block not-italic uppercase text-[10px] tracking-wider">Lovable Truth & Spiritual Essence:</strong>
                  <p>"{selectedShrine.lovableTruth}"</p>
                </div>

                <div className="pt-4 border-t border-sanctuary-800 flex items-center justify-between text-xs text-slate-400">
                  <span>Archived by Amim Ahsan</span>
                  <a href="https://amimahsanlibrary.blogspot.com" target="_blank" rel="noopener noreferrer" className="text-amber-400 underline font-bold">
                    amimahsanlibrary.blogspot.com
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="mt-auto border-t border-amber-500/20 bg-sanctuary-900 py-8 px-4 text-xs text-slate-400 text-center space-y-2">
            <div className="font-bold text-slate-200">1,000 Shrines on Earth: Sanctuary & Truth Archive</div>
            <div>Curated with reverence by <strong>Amim Ahsan</strong>. Explore more at <a href="https://amimahsanlibrary.blogspot.com" target="_blank" rel="noopener noreferrer" className="text-amber-400 underline">amimahsanlibrary.blogspot.com</a></div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
